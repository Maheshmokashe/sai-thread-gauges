# Render.com blueprint — deploys Postgres, the Django API and the React site.
# Import at https://dashboard.render.com  →  New  →  Blueprint
databases:
  - name: sai-db
    databaseName: sai
    plan: free

services:
  # ── Django REST API ──────────────────────────────────────────
  - type: web
    name: saitg-api-hambarde
    runtime: python
    plan: free
    rootDir: sai-backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed"
    startCommand: "gunicorn sai_project.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: sai-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "saitg-api-hambarde.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://saitg-web-hambarde.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://saitg-api-hambarde.onrender.com"
      - key: ENQUIRY_NOTIFY_EMAIL
        value: "saithreadgauges@gmail.com"

  # ── React static site ────────────────────────────────────────
  - type: web
    name: saitg-web-hambarde
    runtime: static
    rootDir: sai-react
    buildCommand: "npm ci && npm run build"
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: "https://saitg-api-hambarde.onrender.com"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"